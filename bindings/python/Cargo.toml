[package]
name = "curious-sdk-python"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "_curious_sdk"
crate-type = ["cdylib"]

[dependencies]
curious-sdk = { path = "../.." }
pyo3 = { version = "0.30", features = ["abi3-py311", "extension-module"] }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
